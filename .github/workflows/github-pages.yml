name: GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - valaxy

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [lts/*]
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/
          cache: 'pnpm'

      - name: 📦 Install Blog Dependencies
        run: pnpm install

      - name: 📦 Install Robot Viewer Dependencies
        working-directory: ./robot_viewer
        run: pnpm install

      - name: 🤖 Build Robot Viewer
        run: npm run build:viewer

      - name: 🌌 Build Valaxy Blog
        run: pnpm run build:ssg

      - name: 🪤 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
